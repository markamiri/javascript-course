<!DOCTYPE html>
<html>
  <head>
    <title>lesson 11 exercises</title>

  <body>
    <script>
      //exercise a
      const nums = [10, 20, 30];
      nums[2] = 99;
      console.log(nums);

      //exercise b
      const lastvalue = getLastValue(nums);
      console.log(lastvalue);
      function getLastValue(array) {
        lastIndex = array.length - 1;
        return array[lastIndex];
      }

      //exercise c
      arraySwap(nums);
      function arraySwap(array) {
        temp = array[0];
        lastIndex = array.length - 1;
        array[0] = array[lastIndex];
        array[lastIndex] = temp;
        console.log(array);
      }

      //exercise d
      for (let i = 0; i <= 10; i += 2) {
        console.log(i);
      }

      //exercise e
      for (let i = 5; i >= 0; i--) {
        console.log(i);
      }

      //exercise f
      let iter = 0;
      console.log("exercise f");

      while (iter <= 10) {
        console.log(iter);
        iter += 2;
      }

      let iter1 = 5;
      console.log("exercise f");
      while (iter1 >= 0) {
        console.log(iter1);
        iter1--;
      }

      //exercise h
      function addOneToArray(array) {
        for (i = 0; i < array.length; i += 1) {
          array[i] = array[i] + 1;
        }
        return array;
      }

      console.log(addOneToArray(nums));

      //exercise i

      function addNumToArray(array, num) {
        for (i = 0; i < array.length; i += 1) {
          array[i] = array[i] + num;
        }
        return array;
      }

      console.log(addNumToArray(nums, 5));

      //exercise j

      temp1 = [1, 2, 3];
      temp2 = [1, 2, 3];
      function addArrayTogether(temp1, temp2) {
        let array = [];
        for (i = 0; i < temp1.length; i += 1) {
          array[i] = temp1[i] + temp1[i];
        }
        return array;
      }

      console.log(addArrayTogether(temp1, temp2));

      //exercise k
      postivecount = [-1, -2, -3, 1, 2, 3];
      function countPositive(array) {
        count = 0;
        for (i = 0; i < array.length; i++) {
          if (array[i] >= 0) {
            count += 1;
          }
        }
        return count;
      }

      console.log(countPositive(postivecount));

      //exercise 11l +11m

      maxmin = [3];
      max = 0;
      min = 100;

      function findMaxMin(array, max, min) {
        if (array.length === 0) {
          max = null;
          min = null;
          return { max, min };
        } else if (array.length === 1) {
          max = array[0];
          min = array[0];
          return { max, min };
        }
        for (i = 0; i < array.length; i += 1) {
          if (array[i] < min) {
            min = array[i];
          }
          if (array[i] > max) {
            max = array[i];
          }
        }
        return { max, min };
      }

      let { max: resmax, min: resmin } = findMaxMin(maxmin, max, min);
      console.log("max min result");
      console.log(resmax);
      console.log(resmin);

      //11n

      function countWords(words) {
        const result = {};

        for (let i = 0; i < words.length; i++) {
          if (!result[words[i]]) {
            result[words[i]] = 1;
          } else {
            result[words[i]] += 1;
          }
        }
        return result;
      }

      console.log(countWords(["apple", "grape", "apple", "apple"]));
    </script>
  </body>
